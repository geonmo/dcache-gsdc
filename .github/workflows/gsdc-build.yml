#
# Builds dCache with the GSDC site patches whenever a new official release of
# the tracked series is published on Docker Hub:
#
#  - RPM, attached to a GitHub release named <version>-<N>_GSDC (N = 2, 3, ...)
#  - container image ghcr.io/<owner>/dcache:<version>-<N>_GSDC, which is the
#    official dcache/dcache:<version> image with the patched files on top
#
# The GitHub release doubles as the "already built" marker.
#
name: GSDC site build

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'dCache version to build (e.g. 11.2.10). Empty: newest release of the series.'
        required: false
        default: ''
      force:
        description: 'Build the next site release (e.g. -3_GSDC after -2_GSDC) even if one exists'
        type: boolean
        default: false

env:
  SERIES: '11.2'
  # Release number of the first site build of a version. Official RPMs are
  # always -1, so site builds start at -2 and count up from there.
  FIRST_BUILD_ID: '2'
  LOCAL_VERSION: '_GSDC'
  UPSTREAM: 'https://github.com/dCache/dcache.git'
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      latest: ${{ steps.detect.outputs.latest }}
      build_id: ${{ steps.detect.outputs.build_id }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          newest=$(curl -sf "https://hub.docker.com/v2/repositories/dcache/dcache/tags?page_size=100&name=${SERIES}." \
                     | jq -r '.results[].name' \
                     | grep -E "^${SERIES//./\\.}\.[0-9]+$" \
                     | sort -V | tail -n 1)
          if [[ -z "$newest" ]]; then
            echo "::error::No dcache/dcache:${SERIES}.x image found on Docker Hub"
            exit 1
          fi

          version=${INPUT_VERSION:-$newest}
          if ! curl -sf -o /dev/null "https://hub.docker.com/v2/repositories/dcache/dcache/tags/${version}"; then
            echo "::error::dcache/dcache:${version} does not exist on Docker Hub"
            exit 1
          fi

          last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName -q '.[].tagName' \
                   | sed -n "s/^${version//./\\.}-\([0-9][0-9]*\)${LOCAL_VERSION}\$/\1/p" \
                   | sort -n | tail -n 1)
          if [[ -z "$last" ]]; then
            build_id=$FIRST_BUILD_ID
          elif [[ "$FORCE" == true ]]; then
            build_id=$((last + 1))
          else
            echo "Release ${version}-${last}${LOCAL_VERSION} already exists; nothing to do."
            version=
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "latest=$([[ "$version" == "$newest" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.version != ''
    runs-on: ubuntu-latest
    # The image used by dCache's own CI to build RPMs, so that rpmbuild finds
    # the build dependencies and macros of the spec file.
    container: docker.io/dcache/maven-java21-rpm-build:latest
    outputs:
      patched: ${{ steps.patch.outcome == 'success' }}
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      BUILD_ID: ${{ needs.detect.outputs.build_id }}
    steps:
      - name: Check out site files
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out dCache ${{ env.VERSION }}
        run: git clone --quiet --depth 1 --branch "$VERSION" "$UPSTREAM" dcache

      - name: Apply site patches
        id: patch
        working-directory: dcache
        run: |
          git config user.name "GSDC site build"
          git config user.email "gsdc-build@users.noreply.github.com"
          git am "$GITHUB_WORKSPACE"/site/patches/*.patch
          git log --reverse --format='- %s' -n "$(ls "$GITHUB_WORKSPACE"/site/patches/*.patch | wc -l)" \
            > "$GITHUB_WORKSPACE"/patches.txt

      # The job runs in a container, where ~ differs between actions/cache and
      # maven, so the local repository is kept in the workspace instead. dCache's
      # own artifacts are rebuilt every time and are not cached.
      - name: Restore maven repository
        id: maven-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .m2/repository
            !.m2/repository/org/dcache
          key: maven-${{ hashFiles('dcache/**/pom.xml') }}
          restore-keys: maven-

      - name: Run tests of patched code
        working-directory: dcache
        run: >
          mvn -B -q -am -pl modules/dcache-chimera,modules/dcache-xrootd install
          -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"
          -Dtest='CapacityTest,DCacheAwareJdbcFsTest,XrootdDoor*Test'
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dmaven.javadoc.skip=true

      - name: Build RPM and tarball
        working-directory: dcache
        run: >
          mvn -B -q -am -pl packages/fhs,packages/tar -P rpm package
          -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"
          -DskipTests -Dmaven.javadoc.skip=true
          -Dbuild.id="$BUILD_ID" -Dlocal.version="$LOCAL_VERSION"

      # Saved even if the build failed, so that the dependencies downloaded so
      # far need not be fetched again from slow or unreachable repositories.
      - name: Save maven repository
        if: always() && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .m2/repository
            !.m2/repository/org/dcache
          key: maven-${{ hashFiles('dcache/**/pom.xml') }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          retention-days: 1
          if-no-files-found: error
          path: |
            dcache/packages/fhs/target/rpmbuild/RPMS/noarch/dcache-*.rpm
            dcache/packages/tar/target/dcache-*.tar.gz
            patches.txt

  report-patch-failure:
    needs: [detect, build]
    if: failure() && needs.build.outputs.patched != 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      BUILD_ID: ${{ needs.detect.outputs.build_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "Site patches do not apply to dCache $VERSION" \
            --body "The patches in \`patches/\` failed to apply to dCache $VERSION. Rebase them onto the $VERSION tag and update \`patches/\`, then re-run the workflow. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  publish:
    needs: [detect, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      BUILD_ID: ${{ needs.detect.outputs.build_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out site files
        uses: actions/checkout@v4
        with:
          path: site

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Prepare container overlay
        run: >
          bash site/container/prepare-overlay.sh "$VERSION"
          "$(find packages -name "dcache-$VERSION.tar.gz")" context

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: context
          push: true
          build-args: DCACHE_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}-${{ env.BUILD_ID }}${{ env.LOCAL_VERSION }}
            ${{ needs.detect.outputs.latest == 'true' && format('{0}:{1}-gsdc', env.IMAGE, env.SERIES) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}-${{ env.BUILD_ID }}${{ env.LOCAL_VERSION }}
            org.opencontainers.image.base.name=docker.io/dcache/dcache:${{ env.VERSION }}

      - name: Create release
        run: |
          release="${VERSION}-${BUILD_ID}${LOCAL_VERSION}"
          {
            echo "dCache $VERSION with the GSDC site patches:"
            echo
            cat "$(find packages -name patches.txt)"
            echo
            echo "Container image: \`$IMAGE:$release\`"
          } > notes.md
          gh release delete "$release" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2> /dev/null || true
          gh release create "$release" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "dCache $release" --notes-file notes.md \
            $(find packages -name 'dcache-*.rpm')
